name: Linux sandbox

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: linux-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bubblewrap-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install sandbox dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends busybox-static curl gcc libcap-dev meson pkg-config xz-utils
          curl --fail --location --proto '=https' \
            --output /tmp/bubblewrap-0.11.2.tar.xz \
            https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz
          echo '69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6  /tmp/bubblewrap-0.11.2.tar.xz' | sha256sum --check
          tar --extract --file /tmp/bubblewrap-0.11.2.tar.xz --directory /tmp
          meson setup /tmp/bubblewrap-0.11.2/build /tmp/bubblewrap-0.11.2 \
            --prefix=/usr/local \
            -Dman=disabled \
            -Dtests=false
          meson compile -C /tmp/bubblewrap-0.11.2/build
          sudo meson install -C /tmp/bubblewrap-0.11.2/build --no-rebuild
          /usr/local/bin/bwrap --version
          /usr/local/bin/bwrap --help 2>&1 | grep --fixed-strings -- '--disable-userns'
          /usr/local/bin/bwrap --help 2>&1 | grep --fixed-strings -- '--seccomp'
          /usr/local/bin/bwrap --help 2>&1 | grep --fixed-strings -- '--ro-bind-fd'

      - name: Allow Bubblewrap user namespace setup
        run: sudo /usr/sbin/apparmor_parser --replace .github/apparmor/bwrap

      - name: Verify Bubblewrap namespace setup
        run: |
          /usr/local/bin/bwrap \
            --unshare-user \
            --disable-userns \
            --unshare-net \
            --ro-bind / / \
            -- \
            /usr/bin/true

      - name: Prepare delegated cgroup v2 subtree
        shell: bash
        run: |
          test "$(stat --file-system --format=%T /sys/fs/cgroup)" = cgroup2fs
          echo '+cpu +memory' | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          sudo mkdir /sys/fs/cgroup/aios-ci
          echo '+cpu +memory' | sudo tee /sys/fs/cgroup/aios-ci/cgroup.subtree_control >/dev/null
          sudo mkdir /sys/fs/cgroup/aios-ci/runtime
          sudo chown --recursive "$(id -u):$(id -g)" /sys/fs/cgroup/aios-ci

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Linux Bubblewrap boundary tests
        env:
          AIOS_BWRAP_PATH: /usr/local/bin/bwrap
          AIOS_BUSYBOX_PATH: /usr/bin/busybox
          AIOS_CGROUP_ROOT: /sys/fs/cgroup/aios-ci
        shell: bash
        run: |
          AIOS_RUNNER_HOME="$HOME" \
            sudo --preserve-env=PATH,AIOS_BWRAP_PATH,AIOS_BUSYBOX_PATH,AIOS_CGROUP_ROOT,AIOS_RUNNER_HOME \
            bash -c '
              echo "$BASHPID" > "$AIOS_CGROUP_ROOT/runtime/cgroup.procs"
              exec setpriv \
                --reuid="$(id -u "$SUDO_USER")" \
                --regid="$(id -g "$SUDO_USER")" \
                --init-groups \
                env \
                  HOME="$AIOS_RUNNER_HOME" \
                  CARGO_HOME="$AIOS_RUNNER_HOME/.cargo" \
                  RUSTUP_HOME="$AIOS_RUNNER_HOME/.rustup" \
                  cargo test -p aios-adapter-process --test linux_bubblewrap --locked -- --ignored
            '

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
